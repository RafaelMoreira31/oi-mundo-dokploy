version: '3.8'
services:
  web:
    image: nginx:alpine
    ports:
      - "8082:80"  # Aqui forçamos o Docker a abrir a porta 8082
    command: /bin/sh -c "echo '<h1>Teste Dokploy e Github! Elza</h1>' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
